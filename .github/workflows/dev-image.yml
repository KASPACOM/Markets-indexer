name: DEV runtime image artifact
on:
  push:
    branches: [feat/dev-seed-parity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build identities
        run: |
          echo "SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHADOW_DECODER_REVISION=$(cat decoder-compatibility.txt)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.shadow-v2
          push: false
          load: true
          tags: markets-indexer:dev-candidate
          build-args: |
            SOURCE_REVISION=${{ env.SOURCE_REVISION }}
            SHADOW_DECODER_REVISION=${{ env.SHADOW_DECODER_REVISION }}
          cache-from: type=gha,scope=markets-indexer
          cache-to: type=gha,mode=max,scope=markets-indexer
      - name: Smoke and export immutable candidate
        run: |
          set -euo pipefail
          docker run --rm markets-indexer:dev-candidate --help
          docker run --rm --entrypoint covenant-tools-api markets-indexer:dev-candidate --help
          test "$(docker inspect markets-indexer:dev-candidate --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_REVISION"
          test "$(docker inspect markets-indexer:dev-candidate --format '{{ index .Config.Labels "com.kaspacom.decoder-revision" }}')" = "$SHADOW_DECODER_REVISION"
          mkdir image-artifact
          docker save markets-indexer:dev-candidate | gzip > image-artifact/markets-indexer.tar.gz
          sha256sum image-artifact/markets-indexer.tar.gz > image-artifact/SHA256SUMS
          docker inspect markets-indexer:dev-candidate --format '{{json .Config.Labels}}' > image-artifact/labels.json
          git rev-parse HEAD > image-artifact/tested-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: markets-dev-image-${{ github.sha }}
          path: image-artifact/
          retention-days: 3
          compression-level: 0
