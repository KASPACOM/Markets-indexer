[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/tn12-indexer-cli"]

[workspace.package]
edition = "2021"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/KASPACOM/Markets-indexer"

[workspace.dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
blake2 = "0.10.6"
hex = "0.4.3"
bytes = "1.10.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "chrono"] }
chrono = { version = "0.4.42", features = ["serde"] }
axum = { version = "0.8.4", features = ["ws", "macros"] }
tower-http = { version = "0.6.2", features = ["trace", "cors"] }
tower = "0.5.3"
futures = "0.3.31"
async-trait = "0.1.86"
reqwest = { version = "0.12.12", features = ["json"] }
secp256k1 = { version = "0.29.1", features = ["global-context", "rand-std"] }
workflow-core = "0.18.0"
borsh = "1.5"
tokio-tungstenite = { version = "0.23.1", features = ["rustls-tls-webpki-roots"] }
workflow-rpc = "0.18.0"
workflow-serializer = "0.18.0"
kaspa-consensus-core = { git = "https://github.com/aspectron/rusty-kaspa.git", rev = "98a4ccd8d200853787f227bd4536ac540cf34957" }
kaspa-wrpc-client = { git = "https://github.com/aspectron/rusty-kaspa.git", rev = "98a4ccd8d200853787f227bd4536ac540cf34957" }
kaspa-rpc-core = { git = "https://github.com/aspectron/rusty-kaspa.git", rev = "98a4ccd8d200853787f227bd4536ac540cf34957" }
kaspa-addresses = { git = "https://github.com/aspectron/rusty-kaspa.git", rev = "98a4ccd8d200853787f227bd4536ac540cf34957" }
kaspa-txscript = { git = "https://github.com/aspectron/rusty-kaspa.git", rev = "98a4ccd8d200853787f227bd4536ac540cf34957" }

tn12-indexer-core = { path = "crates/tn12-indexer-core" }
tn12-indexer-db = { path = "crates/tn12-indexer-db" }
tn12-indexer-crawl = { path = "crates/tn12-indexer-crawl" }
tn12-indexer-decoder = { path = "crates/tn12-indexer-decoder" }
tn12-indexer-api = { path = "crates/tn12-indexer-api" }
