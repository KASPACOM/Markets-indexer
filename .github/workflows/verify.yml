name: Markets indexer verification
permissions:
  contents: read
jobs:
  coordination:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - postgres: '15'
          image: postgres:15-bookworm@sha256:0cb925629e7eb35c77276f3165440d1670c35c2ddbe92b346c579299b75a520f
        - postgres: '16'
          image: postgres:16-bookworm@sha256:cd0e9518bda5f2ea667ff84d22795d089720c883f288e215d97ce57437e8ef37
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: shadow_test
          POSTGRES_PASSWORD: shadow_test
          POSTGRES_DB: postgres
        ports:
        - 5432:5432
        options: --health-cmd="pg_isready -U shadow_test" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      SHADOW_PG_BIN: /tmp/shadow-pg-client
      SHADOW_TEST_ADMIN_DSN: postgresql://shadow_test:shadow_test@127.0.0.1:5432/postgres
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Use clients from the tested PostgreSQL image
      run: 'mkdir -p "$SHADOW_PG_BIN"

        docker cp ''${{ job.services.postgres.id }}:/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_dump'' "$SHADOW_PG_BIN/pg_dump"

        docker cp ''${{ job.services.postgres.id }}:/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_restore'' "$SHADOW_PG_BIN/pg_restore"

        "$SHADOW_PG_BIN/pg_dump" --version

        "$SHADOW_PG_BIN/pg_restore" --version

        '
    - run: pip install -r scripts/shadow-v2/requirements.txt
    - run: python3 -m unittest discover -s scripts/tests -p test_dev_parity.py -v
    - run: python scripts/shadow-v2/test_coordination.py
    - run: python scripts/shadow-v2/test_snapshot.py
    - run: python scripts/shadow-v2/test_archive.py
    - run: git rev-parse HEAD
    - name: Record tested revision
      if: always()
      run: git rev-parse HEAD > tested-sha.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: coordination-${{ matrix.postgres || matrix.suite || 'single' }}-${{ github.run_attempt }}
        path: tested-sha.txt
    timeout-minutes: 45
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm@sha256:cd0e9518bda5f2ea667ff84d22795d089720c883f288e215d97ce57437e8ef37
        env:
          POSTGRES_USER: shadow_test
          POSTGRES_PASSWORD: shadow_test
          POSTGRES_DB: postgres
        ports:
        - 5432:5432
        options: --health-cmd="pg_isready -U shadow_test" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://shadow_test:shadow_test@127.0.0.1:5432/postgres
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: echo "SHADOW_DECODER_REVISION=$(cat decoder-compatibility.txt)" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0
      with:
        toolchain: 1.95.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - run: cargo test --locked -p tn12-indexer-db --test shadow_v2
    - run: cargo test --locked -p tn12-indexer-crawl bounded_notification
    - run: cargo test --locked -p tn12-indexer-crawl shadow_
    - run: cargo test --locked -p tn12-indexer-cli --bin tn10-shadow-indexer
    - run: cargo test --locked -p tn12-indexer-cli --test shadow_replay
    - run: cargo test --locked -p tn12-indexer-api shadow_current_read_contracts
    - run: git rev-parse HEAD
    - name: Record tested revision
      if: always()
      run: git rev-parse HEAD > tested-sha.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: rust-${{ matrix.postgres || matrix.suite || 'single' }}-${{ github.run_attempt }}
        path: tested-sha.txt
    timeout-minutes: 45
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: echo "SHADOW_DECODER_REVISION=$(cat decoder-compatibility.txt)" >> "$GITHUB_ENV"
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: Dockerfile.shadow-v2
        push: false
        load: true
        tags: markets-indexer:verify
        build-args: 'SHADOW_DECODER_REVISION=${{ env.SHADOW_DECODER_REVISION }}

          SOURCE_REVISION=${{ github.sha }}'
        cache-from: type=gha,scope=markets-indexer
        cache-to: type=gha,mode=max,scope=markets-indexer
    - run: docker run --rm markets-indexer:verify --help
    - run: docker run --rm --entrypoint covenant-tools-api markets-indexer:verify --help
    - name: Record tested revision
      if: always()
      run: git rev-parse HEAD > tested-sha.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: image-${{ matrix.postgres || matrix.suite || 'single' }}-${{ github.run_attempt }}
        path: tested-sha.txt
  regression:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm@sha256:cd0e9518bda5f2ea667ff84d22795d089720c883f288e215d97ce57437e8ef37
        env:
          POSTGRES_USER: tn12_test
          POSTGRES_PASSWORD: tn12_test
          POSTGRES_DB: postgres
        ports:
        - 5432:5432
        - 55439:5432
        options: --health-cmd="pg_isready -U tn12_test" --health-interval=5s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgres://tn12_test:tn12_test@127.0.0.1:55439/postgres
      RUST_LOG: info,sqlx=warn
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0
      with:
        toolchain: 1.95.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: ${{ matrix.suite }}
    - run: bash scripts/ci/rust-suite.sh "${{ matrix.suite }}"
    - name: Record tested revision
      if: always()
      run: git rev-parse HEAD > tested-sha.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: regression-${{ matrix.postgres || matrix.suite || 'single' }}-${{ github.run_attempt }}
        path: tested-sha.txt
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
        - general
        - db-unit
        - db-integration-heavy
        - db-integration-other
        - crawl
        - recovery-db
        - recovery-crawl
        - active-output-order
  local-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: bash scripts/verify.sh
    - name: Record tested revision
      if: always()
      run: git rev-parse HEAD > tested-sha.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: local-compose-${{ matrix.postgres || matrix.suite || 'single' }}-${{ github.run_attempt }}
        path: tested-sha.txt
'on':
  push:
    branches:
    - feat/v2-extraction-tests
    - develop
    - main
  pull_request:
    branches:
    - develop
    - main
  workflow_dispatch: null
concurrency:
  group: markets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
